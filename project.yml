name: DevNotch
options:
  bundleIdPrefix: com.halunhaku
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
settings:
  base:
    PRODUCT_NAME: DevNotch
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  DevNotch:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DevNotch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.halunhaku.DevNotch
        INFOPLIST_FILE: DevNotch/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_STRICT_CONCURRENCY: complete
  DevNotchClaudeBridge:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DevNotchClaudeBridge
    settings:
      base:
        PRODUCT_NAME: DevNotchClaudeBridge
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_STRICT_CONCURRENCY: complete
  DevNotchTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/DevNotchTests
    dependencies:
      - target: DevNotch
    settings:
      base:
        PRODUCT_NAME: DevNotchTests
        PRODUCT_BUNDLE_IDENTIFIER: com.halunhaku.DevNotchTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_STRICT_CONCURRENCY: complete
