name: DevNotch
options:
  bundleIdPrefix: com.halunhaku
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
settings:
  base:
    PRODUCT_NAME: DevNotch
    MARKETING_VERSION: "1.1.2"
    CURRENT_PROJECT_VERSION: 5
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  DevNotch:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DevNotch
        excludes:
          - Resources/NowPlayingProbe.swift
      - path: DevNotch/Resources/NowPlayingProbe.swift
        buildPhase: resources
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.halunhaku.DevNotch
        INFOPLIST_FILE: DevNotch/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: DevNotch/DevNotch.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: DevNotchClaudeBridge
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: DevNotchActivityBridge
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: DevNotchNowPlaying
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
  DevNotchClaudeBridge:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DevNotchClaudeBridge
      - path: DevNotch/AI/Services/Activity
    settings:
      base:
        PRODUCT_NAME: DevNotchClaudeBridge
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
  DevNotchActivityBridge:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DevNotchActivityBridge
      - path: DevNotch/AI/Services/Activity
    settings:
      base:
        PRODUCT_NAME: DevNotchActivityBridge
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
  DevNotchNowPlaying:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DevNotchNowPlaying
    settings:
      base:
        PRODUCT_NAME: DevNotchNowPlaying
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: NO
  DevNotchTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/DevNotchTests
    dependencies:
      - target: DevNotch
    settings:
      base:
        PRODUCT_NAME: DevNotchTests
        PRODUCT_BUNDLE_IDENTIFIER: com.halunhaku.DevNotchTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_STRICT_CONCURRENCY: complete
